    <script>
        let crispLoaded = false;

        function initchat() {
            if (!crispLoaded) {
                loadCrisp();
                crispLoaded = true;
            } else {
                openChat();
            }
        }

        function loadCrisp() {
            window.$crisp = [];
            window.CRISP_WEBSITE_ID = "b67ec492-fe9d-426e-a707-9b1fc50e9758";
            const s = document.createElement("script");
            s.src = "https://client.crisp.chat/l.js";
            s.async = true;
            document.head.appendChild(s);
            openChat();
        }

        function openChat() {
            showmsg("getting support ...")

            if (window.$crisp && window.$crisp.push) {
                //         $crisp.push(["do", "chat:show"]);
                $crisp.push(["do", "chat:open"]);
                //         $crisp.push(["do", "chat:focus"]);
            } else {
                setTimeout(openChat, 100);
            }
        }

    <script>

        const divider = document.getElementById("divider")
        const mainpart = document.getElementById("mainpart")
        const saved = localStorage.getItem("dividerPosition")
        if (saved) {
            mainpart.style.width = saved + "%"
        }

        // const bodyclass = localStorage.getItem("bodyclass");
        // if (bodyclass) {
        //     document.body.classList = bodyclass;
        // }

        let dragging = false

        divider.addEventListener("mousedown", () => {
            dragging = true
        })

        document.addEventListener("mousemove", e => {

            if (!dragging) return
            const containerWidth = document.body.clientWidth
            const percent = (e.clientX / containerWidth) * 100
            mainpart.style.width = percent + "%"

        })

        document.addEventListener("mouseup", () => {

            if (!dragging) return
            dragging = false
            const percent = parseFloat(mainpart.style.width)
            localStorage.setItem("dividerPosition", percent)

        })



    </script>
